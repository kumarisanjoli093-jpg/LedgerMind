
name: LedgerMind AI Tests

on:
  push:
    branches:
      - ai-agent
  pull_request:
    branches:
      - ai-agent

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: LedgerMind
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI agent tests
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
        run: |
          pytest ai_agent/test_ai_agent.py -v

      - name: Test Gemini API
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "from ai_agent.gemini_client import generate_text; result = generate_text('Reply with exactly GEMINI_OK', max_output_tokens=20); print(result); assert 'GEMINI_OK' in result"
