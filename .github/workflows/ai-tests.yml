
name: LedgerMind AI Tests

on:
  push:
    branches: [ai-agent]
  pull_request:
    branches: [ai-agent]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: LedgerMind
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
        run: pytest ai_agent/test_ai_agent.py -v

      - name: Test Gemini
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python -c "from ai_agent.gemini_client import generate_text; print(generate_text('Reply GEMINI_OK', max_output_tokens=20))"

      - name: Test Hindsight memory
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY }}
        run: |
          python - <<'PY'
          from integrations import remember_vendor_event, recall_vendor_context

          vendor = "LedgerMind CI Test Vendor"
          content = "LedgerMind integration test reference: LM-TEST-2026-001"

          saved = remember_vendor_event(vendor, content)
          print("Memory save result:", saved)

          recalled = recall_vendor_context(
              vendor=vendor,
              question="What is the LedgerMind integration test reference?"
          )
          print("Memory recall result:", recalled)

          assert saved, "Hindsight memory was not saved"
          assert recalled, "Hindsight returned no memories"

          print("HINDSIGHT_MEMORY_OK")
          PY
