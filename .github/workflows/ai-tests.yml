
name: LedgerMind AI Tests

on:
  push:
    branches:
      - ai-agent
  pull_request:
    branches:
      - ai-agent

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: LedgerMind
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run existing AI tests
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
        run: |
          pytest ai_agent/test_ai_agent.py -v

      - name: Test Gemini API
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python -c "from ai_agent.gemini_client import generate_text; result = generate_text('Reply with exactly GEMINI_OK', max_output_tokens=20); print(result); assert 'GEMINI_OK' in result"

      - name: Test real RAG ingestion and retrieval
        working-directory: LedgerMind
        env:
          PYTHONPATH: .
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import tempfile
          from ai_agent.rag import RAGEngine

          with tempfile.TemporaryDirectory() as folder:
              engine = RAGEngine(db_path=f"{folder}/test.sqlite3")

              text = (
                  "Invoice INV-2026-TEST-001 belongs to ABC Traders. "
                  "The taxable value is 10000 INR. "
                  "CGST is 900 INR and SGST is 900 INR. "
                  "The grand total is 11800 INR."
              )

              count = engine.add_document(
                  document_id="rag-test-001",
                  text=text,
                  metadata={"vendor": "ABC Traders"}
              )

              results = engine.retrieve(
                  query="What is the invoice number for ABC Traders?",
                  top_k=3,
                  vendor="ABC Traders"
              )

              print("Chunks stored:", count)
              print("Retrieved records:", len(results))

              assert count > 0
              assert results
              assert any(
                  "INV-2026-TEST-001" in item["content"]
                  for item in results
              )

              print("RAG_INGESTION_AND_RETRIEVAL_OK")
          PY
